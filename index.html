<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wheel of Fortune Game</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1f2937 0, #020617 55%, #000 100%);
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .game-container {
      background: rgba(2, 6, 23, 0.96);
      border-radius: 24px;
      padding: 24px 32px 32px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.8);
      border: 1px solid #1f2937;
      max-width: 720px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(6px);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 1.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    p.subtitle {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 0.95rem;
      color: #9ca3af;
    }

    .wheel-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }

    canvas {
      background: #020617;
      border-radius: 50%;
      display: block;
    }

    .pointer-label {
      position: absolute;
      top: 50%;
      right: -90px;
      transform: translateY(-50%);
      font-size: 0.75rem;
      color: #fbbf24;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .controls {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #f97316, #facc15);
      color: #111827;
      box-shadow: 0 8px 25px rgba(248, 180, 10, 0.35);
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
      box-shadow: 0 12px 30px rgba(248, 180, 10, 0.45);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 5px 15px rgba(248, 180, 10, 0.35);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .result {
      margin-top: 8px;
      font-size: 1rem;
      min-height: 1.4em;
    }

    .result span {
      color: #4ade80;
      font-weight: 700;
    }

    .hint {
      margin-top: 10px;
      font-size: 0.75rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>Wheel of Fortune</h1>
    <p class="subtitle">Click <strong>Spin</strong> and let the wheel decide your fate.</p>

    <div class="wheel-wrapper">
      <canvas id="wheel" width="420" height="420"></canvas>
      <div class="pointer-label">Pointer ➤</div>
    </div>

    <div class="controls">
      <button id="spinBtn">Spin</button>
    </div>

    <div class="result" id="result"></div>
    <p class="hint">Edit the labels in the code if you want to change the prizes.</p>
  </div>

  <script>
    // ====== CONFIG (8 slices) ======
    const segments = [
      "$100",
      "$250",
      "$500",
      "$1000",
      "BANKRUPT",
      "LOSE A TURN",
      "VACATION PACKAGE",
      "JACKPOT"
    ];

    const sliceColors = [
      "#ef4444", // red
      "#f97316", // orange
      "#eab308", // yellow
      "#22c55e", // green
      "#06b6d4", // cyan
      "#3b82f6", // blue
      "#a855f7", // purple
      "#ec4899"  // pink
    ];

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");

    if (!ctx) {
      alert("Canvas not supported in this browser.");
    }

    const size = canvas.width;
    const centerX = size / 2;
    const centerY = size / 2;
    const radius = size / 2 - 10;
    const arc = (2 * Math.PI) / segments.length;

    // Animation state
    let rotationAngle = 0;
    let spinning = false;
    let spinStartTime = null;
    let spinTotalDuration = 0;
    let maxAngularVelocity = 0;
    let lastFrameTime = null;

    const spinBtn = document.getElementById("spinBtn");
    const resultEl = document.getElementById("result");

    // ====== DRAW WHEEL ======
    function drawWheel() {
      ctx.clearRect(0, 0, size, size);

      // Draw slices
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(rotationAngle);

      for (let i = 0; i < segments.length; i++) {
        const startAngle = i * arc;
        const endAngle = startAngle + arc;

        // Slice
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, startAngle, endAngle, false);
        ctx.closePath();

        ctx.fillStyle = sliceColors[i % sliceColors.length];
        ctx.fill();

        ctx.lineWidth = 2;
        ctx.strokeStyle = "#020617";
        ctx.stroke();

        // Text
        ctx.save();
        const textAngle = startAngle + arc / 2;
        ctx.rotate(textAngle);
        ctx.translate(radius - 22, 0);
        ctx.rotate(Math.PI / 2);

        ctx.fillStyle = "#f9fafb";
        ctx.font = "bold 14px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        wrapText(ctx, segments[i], 0, 0, 90, 16);
        ctx.restore();
      }

      ctx.restore();

      // Outer ring
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#111827";
      ctx.stroke();

      // Center cap
      ctx.beginPath();
      ctx.arc(centerX, centerY, 16, 0, 2 * Math.PI);
      ctx.fillStyle = "#111827";
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#e5e7eb";
      ctx.stroke();

      // ====== SMALL SHARP POINTER (right side) ======
const px = centerX + radius + 2;
const py = centerY;

ctx.beginPath();
// Small, sharp triangle
ctx.moveTo(px + 14, py);      // tip
ctx.lineTo(px - 2, py - 10);  // upper back
ctx.lineTo(px - 2, py + 10);  // lower back
ctx.closePath();

// Pointer color
ctx.fillStyle = "#facc15";

// Draw
ctx.fill();

// Outline for clarity
ctx.lineWidth = 2;
ctx.strokeStyle = "#000000";
ctx.stroke();

    }

    // Wrap text helper
    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(" ");
      let line = "";
      const lines = [];

      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + " ";
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          lines.push(line.trim());
          line = words[n] + " ";
        } else {
          line = testLine;
        }
      }
      lines.push(line.trim());

      const totalHeight = (lines.length - 1) * lineHeight;
      const startY = y - totalHeight / 2;

      lines.forEach((ln, i) => {
        ctx.fillText(ln, x, startY + i * lineHeight);
      });
    }

    // Which segment is under the pointer (pointer is at angle 0, to the right)
    function getWinningIndex() {
      let normalized = rotationAngle % (2 * Math.PI);
      if (normalized < 0) normalized += 2 * Math.PI;

      const theta = (2 * Math.PI - normalized) % (2 * Math.PI);
      let index = Math.floor(theta / arc);
      if (index < 0) index += segments.length;
      return index % segments.length;
    }

    // ====== ANIMATION LOOP ======
    function animate(timestamp) {
      if (!spinning) return;

      if (!spinStartTime) {
        spinStartTime = timestamp;
      }
      if (lastFrameTime == null) {
        lastFrameTime = timestamp;
      }

      const elapsed = timestamp - spinStartTime;
      const t = Math.min(elapsed / spinTotalDuration, 1);

      // ease-out cubic
      const easeOut = 1 - Math.pow(t, 3);
      const angularVelocity = maxAngularVelocity * easeOut; // rad/s

      const frameDelta = (timestamp - lastFrameTime) / 1000; // seconds
      lastFrameTime = timestamp;

      rotationAngle += angularVelocity * frameDelta;
      drawWheel();

      if (t >= 1) {
        spinning = false;
        spinBtn.disabled = false;
        const winnerIndex = getWinningIndex();
        const winner = segments[winnerIndex];
        resultEl.innerHTML = `Result: <span>${winner}</span>`;
        return;
      }

      requestAnimationFrame(animate);
    }

    // ====== SPIN HANDLER ======
    function spin() {
      if (spinning) return;

      spinning = true;
      spinBtn.disabled = true;
      resultEl.textContent = "Spinning...";

      spinStartTime = null;
      lastFrameTime = null;

      spinTotalDuration = 3500 + Math.random() * 2500; // 3.5–6s
      maxAngularVelocity = 10 + Math.random() * 4;     // rad/s

      requestAnimationFrame(animate);
    }

    spinBtn.addEventListener("click", spin);

    // Initial draw
    drawWheel();
  </script>
</body>
</html>
