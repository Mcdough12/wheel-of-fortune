<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Christmas Wheel of Fortune</title>
  <style>
    :root{
      --bg1:#07101f;
      --bg2:#020617;
      --card:#071226cc;
      --border:#1f2937;
      --text:#e5e7eb;
      --muted:#9ca3af;

      --xmas-red:#ef4444;
      --xmas-green:#22c55e;
      --xmas-gold:#fbbf24;
      --xmas-blue:#3b82f6;
      --xmas-pink:#ec4899;
      --xmas-purple:#a855f7;
      --xmas-cyan:#06b6d4;
      --xmas-orange:#f97316;
    }

    body{
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin:0;
      min-height:100vh;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(59,130,246,0.18), transparent 40%),
        radial-gradient(circle at 80% 15%, rgba(34,197,94,0.14), transparent 45%),
        radial-gradient(circle at 50% 0%, rgba(251,191,36,0.10), transparent 55%),
        radial-gradient(circle at 50% 120%, rgba(239,68,68,0.12), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      overflow-x:hidden;
    }

    /* Snow overlay */
    .snow{
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image:
        radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.9) 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 120px 80px, rgba(255,255,255,0.8) 50%, transparent 51%),
        radial-gradient(1.2px 1.2px at 260px 140px, rgba(255,255,255,0.8) 50%, transparent 51%),
        radial-gradient(2px 2px at 380px 200px, rgba(255,255,255,0.7) 50%, transparent 51%),
        radial-gradient(1.6px 1.6px at 520px 60px, rgba(255,255,255,0.9) 50%, transparent 51%),
        radial-gradient(1.3px 1.3px at 640px 170px, rgba(255,255,255,0.7) 50%, transparent 51%),
        radial-gradient(2px 2px at 820px 120px, rgba(255,255,255,0.8) 50%, transparent 51%);
      background-size: 900px 260px;
      animation: snowMove 8s linear infinite;
      filter: blur(0.2px);
    }
    @keyframes snowMove{
      from{ transform: translateY(-20px); }
      to{ transform: translateY(260px); }
    }

    .wrap{
      max-width: 1120px;
      margin: 0 auto;
      padding: 22px 18px 32px;
    }

    .header{
      background: rgba(2,6,23,0.55);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 14px 16px 16px;
      box-shadow: 0 22px 60px rgba(0,0,0,0.45);
      margin-bottom: 14px;
      position: relative;
      overflow:hidden;
    }

    /* simple "lights" */
    .lights{
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:0.9;
      background:
        radial-gradient(circle at 8% 18%, rgba(239,68,68,0.55) 0 6px, transparent 7px),
        radial-gradient(circle at 16% 26%, rgba(34,197,94,0.55) 0 6px, transparent 7px),
        radial-gradient(circle at 24% 18%, rgba(251,191,36,0.55) 0 6px, transparent 7px),
        radial-gradient(circle at 32% 26%, rgba(59,130,246,0.55) 0 6px, transparent 7px),
        radial-gradient(circle at 40% 18%, rgba(236,72,153,0.55) 0 6px, transparent 7px),
        radial-gradient(circle at 48% 26%, rgba(168,85,247,0.55) 0 6px, transparent 7px),
        radial-gradient(circle at 56% 18%, rgba(6,182,212,0.55) 0 6px, transparent 7px),
        radial-gradient(circle at 64% 26%, rgba(249,115,22,0.55) 0 6px, transparent 7px),
        radial-gradient(circle at 72% 18%, rgba(239,68,68,0.55) 0 6px, transparent 7px),
        radial-gradient(circle at 80% 26%, rgba(34,197,94,0.55) 0 6px, transparent 7px),
        radial-gradient(circle at 88% 18%, rgba(251,191,36,0.55) 0 6px, transparent 7px);
      filter: blur(0.2px);
      animation: twinkle 1.8s ease-in-out infinite alternate;
    }
    @keyframes twinkle{
      0%{ opacity: 0.55; }
      100%{ opacity: 0.95; }
    }

    h1{
      margin: 0 0 6px;
      text-transform: uppercase;
      letter-spacing: 0.10em;
      font-size: 1.55rem;
      position: relative;
    }
    .sub{
      margin:0;
      color: var(--muted);
      font-size: 0.95rem;
      position: relative;
    }

    .layout{
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 14px;
      align-items: start;
    }
    @media (max-width: 980px){
      .layout{ grid-template-columns: 1fr; }
    }

    .card{
      background: rgba(2,6,23,0.70);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 22px 60px rgba(0,0,0,0.45);
    }

    .wheel-card{
      padding: 14px;
      text-align: center;
    }

    .wheel-wrapper{
      position: relative;
      display: inline-block;
    }

    canvas{
      background: #020617;
      border-radius: 50%;
      display:block;
      border: 3px solid #e5e7eb;
    }

    .pointer-label{
      position:absolute;
      top:50%;
      right:-84px;
      transform: translateY(-50%);
      font-size: 0.5rem;
      color: var(--xmas-gold);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      opacity: 0.95;
    }

    .game-card{
      padding: 14px 14px 16px;
    }

    .badges{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom: 10px;
    }
    .badge{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid #334155;
      background: rgba(2,6,23,0.75);
      font-size: 0.9rem;
      color:#cbd5e1;
      white-space:nowrap;
    }
    .badge strong{ color:#f8fafc; }

    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin: 10px 0 12px;
      align-items:center;
    }

    button{
      border:none;
      padding: 11px 16px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor:pointer;
      color:#0b1220;
      background: linear-gradient(135deg, var(--xmas-orange), var(--xmas-gold));
      box-shadow: 0 12px 28px rgba(248,180,10,0.20);
      transition: transform .08s ease, filter .08s ease;
    }
    button:hover{ transform: translateY(-1px); filter: brightness(1.05); }
    button:disabled{ opacity: 0.55; cursor:not-allowed; transform:none; }

    .btn-secondary{
      background: linear-gradient(135deg, #38bdf8, #a78bfa);
    }
    .btn-danger{
      background: linear-gradient(135deg, #fb7185, #f97316);
    }

    .board{
      border-radius: 18px;
      border: 1px solid #334155;
      background:
        radial-gradient(circle at 20% 20%, rgba(34,197,94,0.12), transparent 42%),
        radial-gradient(circle at 80% 20%, rgba(239,68,68,0.10), transparent 45%),
        radial-gradient(circle at 50% 0%, rgba(251,191,36,0.10), transparent 55%),
        rgba(2,6,23,0.85);
      padding: 16px 14px 16px;
    }

    .category{
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 0.86rem;
      color: var(--xmas-gold);
      margin-bottom: 10px;
    }

    .phrase{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      font-size: 1.65rem;         /* bigger */
      letter-spacing: 0.14em;
      line-height: 1.6;
      color: #f8fafc;
      min-height: 2.3em;
      word-break: break-word;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-top: 12px;
    }

    input[type="text"]{
      background: rgba(2,6,23,0.85);
      border: 1px solid #334155;
      color: #e5e7eb;
      padding: 11px 12px;
      border-radius: 12px;
      font-size: 1.05rem;
      outline:none;
    }
    input[type="text"]:focus{
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(96,165,250,0.20);
    }

    .message{
      margin-top: 10px;
      min-height: 1.5em;
      color:#cbd5e1;
      font-size: 1.02rem;
    }
    .message strong{ color: #4ade80; }

    .guessed{
      margin-top: 10px;
      color:#94a3b8;
      font-size: 0.95rem;
    }

    .sound-toggle{
      margin-left:auto;
      display:flex;
      gap:8px;
      align-items:center;
      color:#cbd5e1;
      font-size:0.9rem;
      user-select:none;
    }
    .sound-toggle input{ transform: translateY(1px); }
  </style>
</head>
<body>
  <div class="snow"></div>

  <div class="wrap">
    <div class="header">
      <div class="lights"></div>
      <h1>🎄 Holiday Wheel of Fortune</h1>
      <p class="sub">Spin with festive sounds, guess letters, and solve the puzzle.</p>
    </div>

    <div class="layout">
      <div class="card wheel-card">
        <div class="wheel-wrapper">
          <canvas id="wheel" width="420" height="420"></canvas>
          <div class="pointer-label">Pointer ➤</div>
        </div>
      </div>

      <div class="card game-card">
        <div class="badges">
          <span class="badge">Spin Result: <strong id="spinResult">—</strong></span>
          <span class="badge">Round $: <strong id="roundMoney">$0</strong></span>
          <span class="badge">Turn: <strong id="turnStatus">Spin to start</strong></span>

          <label class="sound-toggle badge" title="Toggle sound effects">
            <input id="soundToggle" type="checkbox" checked />
            Sound On
          </label>
        </div>

        <div class="controls">
          <button id="spinBtn">Spin</button>
          <button id="resetRoundBtn" class="btn-danger">Reset Round</button>
          <button id="revealBtn" class="btn-secondary">Reveal (Debug)</button>
        </div>

        <div class="board">
          <!-- Fixed category + fixed puzzle -->
          <div class="category" id="categoryText">CATEGORY: PLACE </div>
          <div class="phrase" id="phraseText">—</div>

          <div class="row">
            <input id="letterInput" type="text" maxlength="1" placeholder="Letter" style="width: 110px;" />
            <button id="guessBtn" class="btn-secondary">Guess</button>
            <button id="buyVowelBtn">Buy Vowel ($250)</button>
          </div>

          <div class="row">
            <input id="solveInput" type="text" placeholder="Solve the puzzle..." style="width: min(620px, 100%);" />
            <button id="solveBtn" class="btn-secondary">Solve</button>
          </div>

          <div class="message" id="message"></div>
          <div class="guessed" id="guessedLetters">Guessed: —</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // =======================
    //  FIXED PUZZLE
    // =======================
    const FIXED_CATEGORY = "PLACE";
    const FIXED_PHRASE = "HUDSON CABIN";

    // =======================
    //  WHEEL CONFIG (8 slices)
    // =======================
    const segments = [
      "$100",
      "$250",
      "$500",
      "$1000",
      "BANKRUPT",
      "LOSE A TURN",
      "Open a Hint",
      "Open a Hint"
    ];

    const sliceColors = [
      "#ef4444", // red
      "#22c55e", // green
      "#fbbf24", // gold
      "#3b82f6", // blue
      "#ec4899", // pink
      "#a855f7", // purple
      "#06b6d4", // cyan
      "#f97316"  // orange
    ];

    // =======================
    //  DOM
    // =======================
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");

    const spinBtn = document.getElementById("spinBtn");
    const resetRoundBtn = document.getElementById("resetRoundBtn");
    const revealBtn = document.getElementById("revealBtn");

    const spinResultEl = document.getElementById("spinResult");
    const roundMoneyEl = document.getElementById("roundMoney");
    const turnStatusEl = document.getElementById("turnStatus");
    const categoryText = document.getElementById("categoryText");
    const phraseText = document.getElementById("phraseText");
    const messageEl = document.getElementById("message");
    const guessedLettersEl = document.getElementById("guessedLetters");

    const letterInput = document.getElementById("letterInput");
    const guessBtn = document.getElementById("guessBtn");
    const buyVowelBtn = document.getElementById("buyVowelBtn");
    const solveInput = document.getElementById("solveInput");
    const solveBtn = document.getElementById("solveBtn");

    const soundToggle = document.getElementById("soundToggle");

    // =======================
    //  AUDIO (no files needed)
    // =======================
    let audioCtx = null;

    function ensureAudio() {
      if (!soundToggle.checked) return null;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function beep({freq=440, dur=0.08, type="sine", gain=0.08} = {}) {
      const ac = ensureAudio();
      if (!ac) return;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.value = gain;
      o.connect(g);
      g.connect(ac.destination);
      o.start();
      o.stop(ac.currentTime + dur);
    }

    // little "click" tick (for spin)
    function tick() {
      const ac = ensureAudio();
      if (!ac) return;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = "square";
      o.frequency.value = 1200;
      g.gain.value = 0.03;
      o.connect(g);
      g.connect(ac.destination);
      o.start();
      o.stop(ac.currentTime + 0.012);
    }

    // festive mini-jingle (win/solve)
    function jingle() {
      const notes = [784, 988, 1175, 988, 784]; // simple bright arpeggio-ish
      let t = 0;
      for (const f of notes) {
        setTimeout(() => beep({freq:f, dur:0.09, type:"triangle", gain:0.09}), t);
        t += 95;
      }
    }

    function sad() {
      beep({freq:220, dur:0.12, type:"sawtooth", gain:0.07});
      setTimeout(() => beep({freq:180, dur:0.16, type:"sawtooth", gain:0.07}), 110);
    }

    // =======================
    //  GAME STATE
    // =======================
    const VOWELS = new Set(["A","E","I","O","U"]);
    const CONSONANTS = new Set("BCDFGHJKLMNPQRSTVWXYZ".split(""));

    let roundMoney = 0;
    let guessedLetters = new Set();

    let lastSpinOutcome = null; // { type: 'cash'|'bankrupt'|'lose'|'prize', value? }
    let canGuessConsonant = false;

    function setMessage(html){ messageEl.innerHTML = html; }
    function updateMoney(){ roundMoneyEl.textContent = `$${roundMoney}`; }
    function updateGuessed(){
      const arr = Array.from(guessedLetters).sort();
      guessedLettersEl.textContent = arr.length ? `Guessed: ${arr.join(", ")}` : "Guessed: —";
    }

    function normalizePhrase(s){
      return s.toUpperCase().replace(/\s+/g," ").trim();
    }

    const puzzle = {
      category: FIXED_CATEGORY,
      phrase: normalizePhrase(FIXED_PHRASE)
    };

    function maskedPhrase(){
      let out = "";
      for (const ch of puzzle.phrase){
        if (/[A-Z]/.test(ch)) out += guessedLetters.has(ch) ? ch : "▢";
        else out += ch;
      }
      return out;
    }

    function countOccurrences(letter){
      let c = 0;
      for (const ch of puzzle.phrase) if (ch === letter) c++;
      return c;
    }

    function isSolved(){
      for (const ch of puzzle.phrase){
        if (/[A-Z]/.test(ch) && !guessedLetters.has(ch)) return false;
      }
      return true;
    }

    function renderPuzzle(){
      categoryText.textContent = `CATEGORY: ${puzzle.category}`;
      phraseText.textContent = maskedPhrase();
      updateGuessed();
      if (isSolved()){
        turnStatusEl.textContent = "Solved!";
        setMessage(`🎁 You solved it! The answer is <strong>${puzzle.phrase}</strong>.`);
      }
    }

    // =======================
    //  WHEEL GEOMETRY + DRAW
    // =======================
    const size = canvas.width;
    const centerX = size / 2;
    const centerY = size / 2;
    const radius = size / 2 - 10;
    const arc = (2 * Math.PI) / segments.length;

    let rotationAngle = 0;
    let spinning = false;
    let spinStartTime = null;
    let spinTotalDuration = 0;
    let maxAngularVelocity = 0;
    let lastFrameTime = null;

    function wrapText(ctx, text, x, y, maxWidth, lineHeight){
      const words = text.split(" ");
      let line = "";
      const lines = [];
      for (let i=0;i<words.length;i++){
        const test = line + words[i] + " ";
        if (ctx.measureText(test).width > maxWidth && i>0){
          lines.push(line.trim());
          line = words[i] + " ";
        } else line = test;
      }
      lines.push(line.trim());
      const total = (lines.length-1)*lineHeight;
      const startY = y - total/2;
      lines.forEach((ln, idx) => ctx.fillText(ln, x, startY + idx*lineHeight));
    }

    function drawWheel(){
      ctx.clearRect(0,0,size,size);

      // slices
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(rotationAngle);

      for (let i=0;i<segments.length;i++){
        const start = i*arc;
        const end = start + arc;

        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.arc(0,0,radius,start,end,false);
        ctx.closePath();
        ctx.fillStyle = sliceColors[i % sliceColors.length];
        ctx.fill();

        ctx.lineWidth = 2;
        ctx.strokeStyle = "#020617";
        ctx.stroke();

        // text
        ctx.save();
        const mid = start + arc/2;
        ctx.rotate(mid);
        ctx.translate(radius - 22, 0);
        ctx.rotate(Math.PI/2);

        ctx.fillStyle = "#f8fafc";
        ctx.font = "bold 14px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        wrapText(ctx, segments[i], 0, 0, 108, 16);
        ctx.restore();
      }

      ctx.restore();

      // ring
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI*2);
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#111827";
      ctx.stroke();

      // center cap (gold)
      ctx.beginPath();
      ctx.arc(centerX, centerY, 16, 0, Math.PI*2);
      ctx.fillStyle = "#111827";
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#e5e7eb";
      ctx.stroke();

      // ====== POINTER: ARROW (shaft + head) on the right ======
      const baseX = centerX + radius + 2;
      const baseY = centerY;

      // shaft
      ctx.save();
      ctx.shadowColor = "rgba(251,191,36,0.55)";
      ctx.shadowBlur = 12;

      ctx.beginPath();
      ctx.roundRect(baseX - 10, baseY - 5, 18, 10, 5);
      const shaftGrad = ctx.createLinearGradient(baseX - 10, baseY, baseX + 8, baseY);
      shaftGrad.addColorStop(0, "#fde68a");
      shaftGrad.addColorStop(1, "#f59e0b");
      ctx.fillStyle = shaftGrad;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#111827";
      ctx.stroke();

      // arrow head
      ctx.beginPath();
      ctx.moveTo(baseX + 8, baseY);
      ctx.lineTo(baseX + 26, baseY - 12);
      ctx.lineTo(baseX + 26, baseY + 12);
      ctx.closePath();
      const headGrad = ctx.createLinearGradient(baseX + 8, baseY, baseX + 26, baseY);
      headGrad.addColorStop(0, "#fef3c7");
      headGrad.addColorStop(1, "#f97316");
      ctx.fillStyle = headGrad;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#111827";
      ctx.stroke();

      ctx.restore();
    }

    // pointer is at angle 0 (right)
    function getWinningIndex(){
      let normalized = rotationAngle % (2*Math.PI);
      if (normalized < 0) normalized += 2*Math.PI;
      const theta = (2*Math.PI - normalized) % (2*Math.PI);
      return Math.floor(theta / arc) % segments.length;
    }

    function parseOutcome(label){
      if (label === "BANKRUPT") return { type:"bankrupt" };
      if (label === "LOSE A TURN") return { type:"lose" };
      if (label === "VACATION PACKAGE") return { type:"prize", value:"VACATION PACKAGE" };
      if (label === "JACKPOT") return { type:"prize", value:"JACKPOT" };
      const m = label.match(/^\$(\d+)/);
      if (m) return { type:"cash", value:Number(m[1]) };
      return { type:"other", value:label };
    }

    function setSpinOutcome(outcome){
      lastSpinOutcome = outcome;
      canGuessConsonant = false;

      if (outcome.type === "cash"){
        spinResultEl.textContent = `$${outcome.value} per consonant`;
        canGuessConsonant = true;
        turnStatusEl.textContent = "Guess a consonant";
        setMessage(`Spin: <strong>$${outcome.value}</strong> per consonant. Guess a consonant.`);
        beep({freq:880, dur:0.06, type:"triangle", gain:0.07});
      } else if (outcome.type === "bankrupt"){
        spinResultEl.textContent = "BANKRUPT";
        roundMoney = 0;
        updateMoney();
        turnStatusEl.textContent = "Spin again";
        setMessage(`🎅 Oh no — <strong>BANKRUPT</strong>. Round money reset to $0.`);
        sad();
      } else if (outcome.type === "lose"){
        spinResultEl.textContent = "LOSE A TURN";
        turnStatusEl.textContent = "Spin again";
        setMessage(`❄️ You hit <strong>LOSE A TURN</strong>. Spin again.`);
        beep({freq:300, dur:0.07, type:"square", gain:0.06});
        setTimeout(()=>beep({freq:220, dur:0.09, type:"square", gain:0.06}), 85);
      } else if (outcome.type === "prize"){
        spinResultEl.textContent = outcome.value;
        turnStatusEl.textContent = "Spin again";
        setMessage(`🎁 Prize slice: <strong>${outcome.value}</strong>. You can buy a vowel, solve, or spin again.`);
        beep({freq:988, dur:0.08, type:"triangle", gain:0.08});
      } else {
        spinResultEl.textContent = String(outcome.value ?? "—");
        turnStatusEl.textContent = "Spin again";
        setMessage(`Spin result: <strong>${spinResultEl.textContent}</strong>.`);
      }
    }

    // tick scheduling during spin
    let tickTimer = null;
    function startSpinTicks(){
      stopSpinTicks();
      let interval = 55; // ms (fast at start)
      tickTimer = setInterval(() => tick(), interval);
    }
    function stopSpinTicks(){
      if (tickTimer) clearInterval(tickTimer);
      tickTimer = null;
    }

    function animate(timestamp){
      if (!spinning) return;

      if (!spinStartTime) spinStartTime = timestamp;
      if (lastFrameTime == null) lastFrameTime = timestamp;

      const elapsed = timestamp - spinStartTime;
      const t = Math.min(elapsed / spinTotalDuration, 1);

      const easeOut = 1 - Math.pow(t, 3);
      const angularVelocity = maxAngularVelocity * easeOut;

      const frameDelta = (timestamp - lastFrameTime) / 1000;
      lastFrameTime = timestamp;

      rotationAngle += angularVelocity * frameDelta;
      drawWheel();

      // slow down tick rate near the end for realism
      // (simple approach: adjust timer interval a few times)
      if (soundToggle.checked && tickTimer) {
        // no-op here; timer stays steady; still sounds good.
        // If you want, we can make it dynamically slow.
      }

      if (t >= 1){
        spinning = false;
        spinBtn.disabled = false;
        stopSpinTicks();

        const winnerIndex = getWinningIndex();
        const label = segments[winnerIndex];
        setSpinOutcome(parseOutcome(label));
        return;
      }

      requestAnimationFrame(animate);
    }

    function spin(){
      if (spinning) return;

      // ensure audio can play (browsers require user gesture—this click counts)
      ensureAudio();

      if (isSolved()){
        setMessage(`Already solved! The answer is <strong>${puzzle.phrase}</strong>. Reset Round to play again.`);
        return;
      }

      spinning = true;
      spinBtn.disabled = true;
      turnStatusEl.textContent = "Spinning...";
      setMessage("🎄 Spinning...");
      spinStartTime = null;
      lastFrameTime = null;

      spinTotalDuration = 3500 + Math.random() * 2500;
      maxAngularVelocity = 10 + Math.random() * 4;

      startSpinTicks();
      requestAnimationFrame(animate);
    }

    // =======================
    //  LETTER GUESSING
    // =======================
    function guessLetter(){
      if (isSolved()) return;

      const raw = (letterInput.value || "").toUpperCase();
      letterInput.value = "";

      if (!/^[A-Z]$/.test(raw)){
        setMessage("Enter a single letter A–Z.");
        beep({freq:260, dur:0.06, type:"square", gain:0.05});
        return;
      }

      if (guessedLetters.has(raw)){
        setMessage(`You already guessed <strong>${raw}</strong>.`);
        beep({freq:240, dur:0.06, type:"square", gain:0.05});
        return;
      }

      if (VOWELS.has(raw)){
        setMessage(`Use <strong>Buy Vowel</strong> for vowels (costs $250).`);
        beep({freq:280, dur:0.06, type:"square", gain:0.05});
        return;
      }

      if (!canGuessConsonant){
        setMessage("Spin first to get a cash value, then guess a consonant.");
        beep({freq:280, dur:0.06, type:"square", gain:0.05});
        return;
      }

      guessedLetters.add(raw);
      const count = countOccurrences(raw);

      if (count === 0){
        canGuessConsonant = false;
        turnStatusEl.textContent = "Spin again";
        setMessage(`No <strong>${raw}</strong>'s. Spin again.`);
        sad();
      } else {
        const earned = (lastSpinOutcome?.type === "cash") ? (lastSpinOutcome.value * count) : 0;
        roundMoney += earned;
        updateMoney();
        canGuessConsonant = false;
        turnStatusEl.textContent = "Spin again";
        setMessage(`Nice! <strong>${raw}</strong> appears <strong>${count}</strong> time(s). You earned <strong>$${earned}</strong>.`);
        // bright "correct" chirp
        beep({freq:1046, dur:0.06, type:"triangle", gain:0.08});
        setTimeout(()=>beep({freq:1318, dur:0.07, type:"triangle", gain:0.08}), 70);
      }

      renderPuzzle();
      if (isSolved()) jingle();
    }

    function buyVowel(){
      if (isSolved()) return;

      const raw = (letterInput.value || "").toUpperCase();

      if (roundMoney < 250){
        setMessage("You need at least <strong>$250</strong> to buy a vowel.");
        beep({freq:220, dur:0.07, type:"square", gain:0.06});
        return;
      }

      if (!/^[A-Z]$/.test(raw) || !VOWELS.has(raw)){
        setMessage("Type a vowel (A, E, I, O, U) in the letter box, then click Buy Vowel.");
        beep({freq:240, dur:0.07, type:"square", gain:0.06});
        return;
      }

      letterInput.value = "";

      if (guessedLetters.has(raw)){
        setMessage(`You already guessed <strong>${raw}</strong>.`);
        beep({freq:240, dur:0.06, type:"square", gain:0.05});
        return;
      }

      roundMoney -= 250;
      updateMoney();
      guessedLetters.add(raw);

      const count = countOccurrences(raw);
      if (count === 0){
        setMessage(`No <strong>${raw}</strong>'s. Spin again or solve.`);
        sad();
      } else {
        setMessage(`Vowel bought! <strong>${raw}</strong> appears <strong>${count}</strong> time(s).`);
        beep({freq:880, dur:0.06, type:"triangle", gain:0.07});
      }

      renderPuzzle();
      if (isSolved()) jingle();
    }

    function solvePuzzle(){
      if (isSolved()) return;

      const attempt = normalizePhrase(solveInput.value || "");
      solveInput.value = "";

      if (!attempt){
        setMessage("Type your solution in the solve box.");
        beep({freq:240, dur:0.06, type:"square", gain:0.05});
        return;
      }

      if (attempt === puzzle.phrase){
        for (const ch of puzzle.phrase){
          if (/[A-Z]/.test(ch)) guessedLetters.add(ch);
        }
        renderPuzzle();
        turnStatusEl.textContent = "Solved!";
        setMessage(`🎁 Correct! The answer is <strong>${puzzle.phrase}</strong>. Merry Christmas!`);
        jingle();
      } else {
        setMessage("❌ Not quite. Try again!");
        sad();
      }
    }

    function resetRound(){
      roundMoney = 0;
      guessedLetters = new Set();
      lastSpinOutcome = null;
      canGuessConsonant = false;

      spinResultEl.textContent = "—";
      updateMoney();
      turnStatusEl.textContent = "Spin to start";
      setMessage("Round reset. Click Spin.");
      renderPuzzle();
      beep({freq:660, dur:0.06, type:"triangle", gain:0.06});
    }

    // ===== debug reveal
    function revealAll(){
      for (const ch of puzzle.phrase){
        if (/[A-Z]/.test(ch)) guessedLetters.add(ch);
      }
      renderPuzzle();
      setMessage(`(Debug) Revealed: <strong>${puzzle.phrase}</strong>.`);
      jingle();
    }

    // =======================
    //  EVENTS
    // =======================
    spinBtn.addEventListener("click", spin);
    resetRoundBtn.addEventListener("click", resetRound);
    revealBtn.addEventListener("click", revealAll);

    guessBtn.addEventListener("click", guessLetter);
    buyVowelBtn.addEventListener("click", buyVowel);
    solveBtn.addEventListener("click", solvePuzzle);

    letterInput.addEventListener("keydown", (e)=>{ if (e.key==="Enter") guessLetter(); });
    solveInput.addEventListener("keydown", (e)=>{ if (e.key==="Enter") solvePuzzle(); });

    // =======================
    //  INIT
    // =======================
    updateMoney();
    categoryText.textContent = `CATEGORY: ${puzzle.category}`;
    renderPuzzle();
    drawWheel();
    setMessage("Click <strong>Spin</strong> to start the round. 🎄");
  </script>
</body>
</html>
